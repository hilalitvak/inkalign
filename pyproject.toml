[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkalign"
version = "0.1.0"
description = "Depth-offset and orientation calibrator for Vesuvius Challenge surface volumes: is your surface at the right depth, and is it facing the right way?"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hila Litvak" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "zarr>=2.16,<3",
    "fsspec>=2023.1",
    "aiohttp>=3.8",
    "tifffile>=2023.1",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/hilalitvak/inkalign"

[project.scripts]
inkalign = "inkalign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
